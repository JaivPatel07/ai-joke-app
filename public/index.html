<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joke Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(150deg, #fff8ef, #ffe5d4);
      font-family: "Plus Jakarta Sans", sans-serif;
      color: #2a1f19;
    }

    .card {
      width: min(560px, 92vw);
      padding: 26px;
      border-radius: 34px;
      background: #fffdf9;
      border: 1px solid #efd9cb;
      box-shadow: 0 16px 34px rgba(103, 67, 43, 0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }

    p {
      margin: 0;
      color: #6b5648;
    }

    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #e06e40;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .joke {
      margin-top: 16px;
      min-height: 120px;
      padding: 18px;
      border-radius: 24px;
      background: #fff5ea;
      border: 1px solid #f0d8c7;
      line-height: 1.55;
      font-size: 1.06rem;
    }

    .status {
      display: block;
      margin-top: 10px;
      font-size: 0.86rem;
      color: #7b675a;
    }

    @media (max-width: 540px) {
      .card {
        padding: 20px;
        border-radius: 28px;
      }

      .joke {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Joke Drop</h1>
    <p>Simple, clean, and curvy. Tap once for a fresh joke.</p>
    <button id="btn" type="button">Get Joke</button>
    <section id="joke" class="joke" aria-live="polite">Tap the button to start.</section>
    <small id="status" class="status">Ready</small>
  </main>

  <script>
    const btn = document.getElementById("btn");
    const jokeBox = document.getElementById("joke");
    const status = document.getElementById("status");

    const esc = (s) => s
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

    async function getJoke() {
      btn.disabled = true;
      status.textContent = "Fetching";
      jokeBox.textContent = "Thinking of something good...";

      try {
        const res = await fetch("/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });

        if (!res.ok) throw new Error("Request failed");

        const data = await res.json();
        if (!data || typeof data.joke !== "string") {
          throw new Error("Invalid payload");
        }

        jokeBox.innerHTML = esc(data.joke);
        status.textContent = "Fresh joke served";
      } catch {
        jokeBox.textContent = "Could not fetch a joke right now. Try again soon.";
        status.textContent = "Temporarily unavailable";
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", getJoke);
  </script>
</body>
</html>
